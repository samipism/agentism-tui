version: 2

builds:
  - id: agentism-tui
    main: ./cmd/agentism-tui
    binary: agentism-tui
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: agentism-tui
    formats: [tar.gz]
    files:
      - none*

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: samipism
    name: agentism-tui
